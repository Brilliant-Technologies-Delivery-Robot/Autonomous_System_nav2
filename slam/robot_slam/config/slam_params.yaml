slam_toolbox:
  ros__parameters:
    use_sim_time: true
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    # mode: mapping 
    mode: localization
    # use_map_saver: true
    resolution: 0.05
    min_laser_range: 0.22
    max_laser_range: 12.0
    map_start_at_dock: true
    minimum_travel_distance: 0.2
    minimum_travel_heading: 0.1
    map_update_interval: 2.0
    publish_map_tf: true
